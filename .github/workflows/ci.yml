name: CI

on:
  push:
  pull_request:

jobs:
  root:
    name: root module (baseline entry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l cmd internal conversation
      - run: go vet ./cmd/... ./internal/... ./conversation/...
      - run: go test -count=1 ./cmd/... ./internal/... ./conversation/...

  v2:
    name: v2 module (application kernel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: v2/go.mod
      # Fail the job on an unformatted file, not just print one: `gofmt -l .` on its own
      # leaves the step green while listing offenders, so a formatting regression can be
      # merged and only shows up as scrollback. Same form the eval job already uses.
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
      # The reference entry carries a build tag, so the steps above never see
      # it. Building the tag here is what keeps that file from rotting
      # unnoticed: it used to name an AI helper factory and a router that no
      # longer exist, and nothing noticed because nothing built it.
      - run: go build -tags v2_entry_reference -o /dev/null .

  hybrid:
    name: hybrid module (integrated entry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hybrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hybrid/go.mod
      # The hybrid regressions drive the real Vue client through Node, so the
      # web dependencies have to be installed before `go test`. Without them the
      # Node helpers abort with ERR_MODULE_NOT_FOUND.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: gofmt -l .
      - run: go vet ./...
      - run: go test -count=1 ./...

  eval:
    name: eval module (retrieval evaluation harness)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: eval/go.mod
      # The harness's tests are offline: fake embedder, fake reranker and an
      # in-memory index. No model, Redis or network is touched.
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
      # The L2/L3 runner and assertions (eval/l2l3) are plain Node with no dependencies:
      # a fake backend plays the model, so nothing here calls a model, Redis or the network.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "l2l3/test/*.test.mjs"
      - run: node --test "l4/test/*.test.mjs"

  frontend:
    name: web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
