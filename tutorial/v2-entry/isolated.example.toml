# Independent deployment template. Empty keys deliberately refuse startup.
# Do not point this file at a GopherLearn business database or existing Redis.
[isolatedEntry]
isolated = true
migrate = false
chatKey = ""
chatModel = "explicit-model-name"
chatBaseURL = "https://provider.invalid/v1"
[mainConfig]
host = "127.0.0.1"
port = 18082
[mysqlConfig]
host = "mysql-isolated.invalid"
port = 3306
user = "v2_isolated"
password = ""
databaseName = "v2_isolated"
charset = "utf8mb4"
[redisConfig]
host = "redis-isolated.invalid"
port = 6379
db = 0
password = ""
[jwtConfig]
key = ""
expire_duration = 24
issuer = "v2-isolated"
subject = "v2-isolated-user"
[knowledgeConfig]
storageDir = "data/v2-isolated/knowledge"
[ragModelConfig]
embeddingModel = "explicit-embedding-model"
embeddingBaseUrl = "https://embedding.invalid/v1"
embeddingApiKey = ""
chatModelName = "explicit-model-name"
dimension = 1024
rerankEnabled = false
# Omitted agent fields retain the build's defaults: legacy_v2/shadow_only.
# A deployment may explicitly choose legacy_v2/inject_enabled.
#
# The layered summary is on by default: the window carries the board and the
# summary segments instead of the old rolling summary. A deployment that wants
# the rolling summary writes summarySegmentMode = "off"; one that only wants to
# watch the write side writes summarySegmentMode = "shadow".
# [agentConfig]
# summarySegmentMode = "on"

# The assistant's own products are recorded too: the exercises it gave, the
# plan it settled with the learner, the names and the numbers it offered. A
# deployment that wants only the learner's own statements writes
# summaryAssistantContent = "off" and restarts.
# [agentConfig]
# summaryAssistantContent = "off"

# The session-card path is on by default: the cross-session memory is written
# and read as session cards, and the card the program derives (the "thin" card)
# costs no model call at all. A deployment that wants the old Episode path
# writes sessionCardMode = "disabled" and restarts.
#
# Turning the card path on replaces the Episode path rather than running beside
# it: one session gets one card, written from that session's own summary, and
# the two generation models would otherwise answer the same question about the
# same conversation twice. The cards live in their own index namespace, so the
# two arms of a comparison do not read each other's rows.
#
# A deployment that wants the full card - the one the model writes, with a body
# of its own - writes sessionCardMode = "enabled".
# [agentConfig]
# sessionCardMode = "disabled"
