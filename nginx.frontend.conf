# Frontend serving for the local Phase 8C stack.
#
# One origin for the browser: static files plus a same-origin /api/ proxy, so the bundled
# client keeps using the relative paths it already uses under the Vite dev server and the
# backend needs no CORS allowance.
#
# The stream route is spelled out separately from /api/ on purpose. `proxy_buffering off`
# on the prefix block would work today, and a later edit that adds caching to /api/ would
# silently turn server-sent events into one blob at the end - which is exactly the failure
# this file must not allow.

upstream gopherlearn_backend {
    server backend:8080;

    # A pooled idle connection costs nothing here: the backend sits on the same Docker
    # network, and an 8B.3 idle bound recycles it long before this would notice.
    keepalive 16;
}

# One question, one measurement: is an event stream passed through as it is produced, or
# does the proxy drain the upstream and then feed the client? $request_time covers the whole
# exchange, $upstream_response_time covers only the upstream side. A client that stalls
# mid-stream therefore separates the two regimes on its own: pass-through makes the numbers
# converge (the blocked client backs up into the upstream), buffering makes them diverge
# (the upstream finishes while the proxy still holds the answer). This file is included in
# the http context, which is where a log_format belongs.
log_format gopherlearn_stream '$remote_addr [$time_iso8601] uri=$uri status=$status request_time=$request_time upstream_response_time=$upstream_response_time bytes=$body_bytes_sent';

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 4 MiB, so the proxy never rejects what the backend would still accept: the Go server
    # caps a request body at 1 MiB (io.LimitReader in internal/httpapi) and answers 400
    # above it. A 413 from here would be the proxy inventing a contract.
    client_max_body_size 4m;
    client_body_timeout 60s;

    # Hashed asset filenames are safe to cache; the entry document is not.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Server-sent events: no buffering, no cache, no gzip, no re-chunking, and a read
    # timeout long enough that a slow answer is not mistaken for a dead connection.
    location ~ ^/api/v1/sessions/[^/]+/stream$ {
        proxy_pass http://gopherlearn_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        tcp_nodelay on;

        proxy_connect_timeout 5s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;

        # The timing line above, for this route only.
        access_log /var/log/nginx/gopherlearn-stream.log gopherlearn_stream;
    }

    # Everything else under /api/: plain request/response, same upstream, same body limit.
    location /api/ {
        proxy_pass http://gopherlearn_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA fallback: the client owns routing (/chat/:id, /learning, ...), so an unknown
    # path serves the entry document. Anything that does not exist under /assets/ stays a
    # 404 above rather than becoming a bogus index.html.
    location / {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
